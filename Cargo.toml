[package]
name = "veh_counter_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "1"
url = "2"
tensorrt = "0.1.0"
# once_cell = "1.21.3"

ndarray = "0.15"

# ONNX Runtime v1.x (pakai .so dari sistem via env ORT_DYLIB_PATH)
ort = { version = "1.16.3", features = ["load-dynamic", "cuda", "tensorrt"] }

clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# MQTT WebSocket (HiveMQ Cloud)
rumqttc = { version = "0.24", default-features = false, features = ["websocket", "use-rustls", "url"] }

# MySQL (LAMPP)
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
once_cell = "1.21.3"
opencv = "0.96.0"
