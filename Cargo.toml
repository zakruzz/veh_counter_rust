[package]
name = "veh_counter_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "mysql", "macros", "time"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
opencv = "0.86"   # <— TANPA fitur opencv-4/opencv-48 dll

